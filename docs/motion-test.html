<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>motion.js — FLIP proof</title>

<!-- The REAL stylesheet, not a copy of the tokens: half of what this page proves is that
     motion.js picks its durations and easings up out of styles.css. Serve the repo root and
     open /docs/motion-test.html — e.g. `python3 -m http.server 8791` from the repo root, then
     http://127.0.0.1:8791/docs/motion-test.html. The font 404s in that setup are expected and
     harmless (the app serves /vendor from public/); nothing this page measures is type. -->
<link rel="stylesheet" href="../public/styles.css">

<style>
  /* Scoped to this harness. body is the app shell's (flex column, overflow hidden), so the
     page gets one scrolling pane of its own rather than fighting it. */
  .mt-page { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: var(--sp-4); }
  .mt-page h1 { font-family: var(--font-display); font-size: 22px; margin: 0 0 4px; }
  .mt-sub { color: var(--ink-2); font-size: 13px; margin: 0 0 var(--sp-4); }
  .mt-bar { display: flex; flex-wrap: wrap; gap: var(--sp-2); margin-bottom: var(--sp-4); }
  .mt-bar button {
    min-height: var(--tap); padding: 0 var(--sp-3);
    border: 1px solid var(--line-strong); border-radius: var(--r-md);
    background: var(--surface); color: var(--ink); font: 600 14px var(--font-ui);
  }
  .mt-bar button:active { background: var(--press); }
  .mt-list {
    list-style: none; margin: 0 0 var(--sp-4); padding: 0;
    display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-2);
  }
  /* Two columns and two heights on purpose: a single-column list only ever produces vertical
     deltas, and a FLIP bug in the x axis would go unseen. */
  .mt-row {
    display: flex; align-items: center; justify-content: center;
    min-height: var(--tap); border-radius: var(--r-md);
    background: var(--surface-2); color: var(--ink);
    font: 600 15px var(--font-ui);
  }
  .mt-row:nth-child(3n) { min-height: 64px; }
  .mt-tick { display: block; margin: 0 auto var(--sp-4); }
  .mt-tick path { fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-linecap: round;
                  stroke-linejoin: round; }
  .mt-out {
    margin: 0; padding: var(--sp-3); border-radius: var(--r-md);
    background: var(--surface); color: var(--ink);
    font: 12.5px/1.6 ui-monospace, Menlo, monospace; white-space: pre-wrap;
  }
</style>

<div class="mt-page">
  <h1>motion.js — FLIP proof</h1>
  <p class="mt-sub">12 keyed rows. Buttons are for watching; the report below is measured with
     WAAPI, by pausing every player and stepping <code>currentTime</code>.</p>

  <div class="mt-bar">
    <button id="mt-shuffle" type="button">Shuffle</button>
    <button id="mt-churn" type="button">3 out / 3 in</button>
    <button id="mt-settle" type="button">settle()</button>
    <button id="mt-draw" type="button">drawCheck()</button>
    <button id="mt-run" type="button">Run all checks</button>
  </div>

  <svg class="mt-tick" width="40" height="40" viewBox="0 0 24 24" aria-hidden="true">
    <path id="mt-path" d="M5 12.5l4.5 4.5L19 7.5"/>
  </svg>

  <ol class="mt-list" id="mt-list"></ol>
  <pre class="mt-out" id="mt-out">running…</pre>
</div>

<script type="module">
import { flip, drawCheck, settle, breathe, reducedMotion, ms } from "../public/js/motion.js";

const list = document.getElementById("mt-list");
const out = document.getElementById("mt-out");
const tick = document.getElementById("mt-path");

let pass = 0, fail = 0;
const log = (s) => { out.textContent += s + "\n"; };
const ok = (c, msg) => { c ? pass++ : fail++; log((c ? "PASS  " : "FAIL  ") + msg); };
const sleep = (n) => new Promise((r) => setTimeout(r, n));

// Deterministic shuffle: a failure has to be reproducible, and Math.random() makes "worst
// delta 0.4px" a number nobody can check twice.
function mulberry(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

let nextKey = 12;
const rowEl = (k) => {
  const li = document.createElement("li");
  li.className = "mt-row";
  li.dataset.key = k;
  li.textContent = k;
  return li;
};
function build(n = 12) {
  nextKey = n;
  list.replaceChildren(...Array.from({ length: n }, (_, i) => rowEl("k" + i)));
}
function shuffleDom(seed) {
  const rnd = mulberry(seed);
  const kids = [...list.children];
  for (let i = kids.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    [kids[i], kids[j]] = [kids[j], kids[i]];
  }
  list.append(...kids);                    // append moves nodes; it does not clone them
}
const rects = () => {
  const m = new Map();
  for (const el of list.querySelectorAll("[data-key]")) m.set(el.dataset.key, el.getBoundingClientRect());
  return m;
};
const players = () =>
  document.getAnimations().filter((a) => a.effect && list.contains(a.effect.target));
// Every property a player actually animates, minus the keyframe bookkeeping keys.
const props = (a) => {
  const s = new Set();
  for (const kf of a.effect.getKeyframes()) {
    for (const k of Object.keys(kf)) {
      if (!["offset", "computedOffset", "easing", "composite"].includes(k)) s.add(k);
    }
  }
  return s;
};
function worstDelta(a, b) {
  let d = 0, key = "";
  for (const [k, r] of a) {
    const o = b.get(k);
    if (!o) continue;
    const m = Math.max(Math.abs(r.left - o.left), Math.abs(r.top - o.top));
    if (m > d) { d = m; key = k; }
  }
  return { d, key };
}

// ── 1. pure reorder ──────────────────────────────────────────────────────────────────────
async function checkReorder() {
  log("\n— 12 keyed rows, shuffled —");
  build();
  const dur = ms("--dur", -1);
  ok(dur === 220, `--dur read out of styles.css = ${dur}ms`);

  const before = rects();
  const nodes = new Map([...list.children].map((n) => [n.dataset.key, n]));
  const done = flip(list, () => shuffleDom(7));

  const ps = players();
  ps.forEach((p) => p.pause());
  ok(ps.length >= 10, `${ps.length} of 12 rows animate (a row that did not move must not)`);

  const bad = [];
  for (const p of ps) for (const k of props(p)) if (k !== "transform") bad.push(`${p.effect.target.dataset.key}:${k}`);
  ok(bad.length === 0, `transform-only — no layout property, no opacity${bad.length ? ` (saw ${bad.join(", ")})` : ""}`);

  let same = 0;
  for (const el of list.children) if (nodes.get(el.dataset.key) === el) same++;
  ok(same === 12, `${same}/12 rows are the SAME node moved, not a re-render`);

  const curve = (s) => (String(s).match(/-?[\d.]+/g) || []).map(Number).join();
  const easeOut = getComputedStyle(document.documentElement).getPropertyValue("--ease-out").trim();
  ok(ps.every((p) => p.effect.getTiming().duration === dur && curve(p.effect.getTiming().easing) === curve(easeOut)),
     `every player runs --dur on --ease-out (${dur}ms ${easeOut})`);

  ps.forEach((p) => { p.currentTime = 0; });
  const t0 = worstDelta(rects(), before);
  ok(t0.d <= 1, `t=0: every row is inverted back onto its old position (worst ${t0.d.toFixed(2)}px @ ${t0.key || "-"})`);

  ps.forEach((p) => { p.currentTime = dur; });
  const atEnd = rects();
  ps.forEach((p) => p.cancel());           // fill:none, so cancelling reveals the true layout
  const layout = rects();
  const t1 = worstDelta(atEnd, layout);
  ok(t1.d <= 1, `t=${dur}: every row lands within 1px of its new layout position (worst ${t1.d.toFixed(2)}px @ ${t1.key || "-"})`);
  const moved = worstDelta(before, layout);
  ok(moved.d > 20, `the shuffle actually moved things (largest move ${moved.d.toFixed(1)}px @ ${moved.key})`);
  await done;
}

// ── 2. arrivals and departures ───────────────────────────────────────────────────────────
async function checkChurn() {
  log("\n— 3 removed, 3 added, rest shuffled —");
  build();
  const dur = ms("--dur", 220);
  const before = rects();
  const goners = ["k2", "k5", "k9"];

  const done = flip(list, () => {
    for (const k of goners) list.querySelector(`[data-key="${k}"]`).remove();
    for (let i = 0; i < 3; i++) list.append(rowEl("k" + nextKey++));
    shuffleDom(23);
  });

  const ps = players();
  ps.forEach((p) => p.pause());
  const enters = ps.filter((p) => props(p).has("opacity") && !p.effect.target.style.position);
  const ghosts = ps.filter((p) => p.effect.target.style.position === "fixed");
  const movers = ps.filter((p) => !enters.includes(p) && !ghosts.includes(p));

  ok(enters.length === 3, `${enters.length} arrivals fade up`);
  ok(ghosts.length === 3, `${ghosts.length} leavers fade down as fixed ghosts`);
  ok(movers.every((p) => [...props(p)].join() === "transform"),
     `${movers.length} survivors still animate transform only`);
  ok(enters.every((p) => { const s = props(p); return s.has("transform") && s.has("opacity") && s.size === 2; }),
     "arrivals animate opacity + transform and nothing else");

  ghosts.forEach((p) => { p.currentTime = 0; });
  let gd = 0;
  for (const p of ghosts) {
    const el = p.effect.target, r = el.getBoundingClientRect(), o = before.get(el.dataset.key);
    gd = Math.max(gd, Math.abs(r.left - o.left), Math.abs(r.top - o.top));
  }
  ok(gd <= 1, `a leaver's ghost starts within 1px of where the row was (worst ${gd.toFixed(2)}px)`);
  ok(ghosts.every((p) => list.contains(p.effect.target)),
     "ghosts stay inside the container, so their styling still resolves");

  ps.forEach((p) => { p.currentTime = dur; });
  const atEnd = rects();
  const survivors = new Map([...atEnd].filter(([k]) => !goners.includes(k)));
  ps.forEach((p) => p.cancel());
  await sleep(dur + 400);                  // the ghost-removal deadline
  const layout = rects();
  const t1 = worstDelta(survivors, layout);
  ok(t1.d <= 1, `t=${dur}: survivors and arrivals land within 1px (worst ${t1.d.toFixed(2)}px @ ${t1.key || "-"})`);
  ok(list.children.length === 12 && !list.querySelector('[style*="fixed"]'),
     `ghosts removed on the deadline — ${list.children.length} rows left, 0 ghosts`);
  await done;
}

// ── 2b. a row that leaves the container but stays in the document ────────────────────────
// The pack regroup case: an item dragged into another section is re-parented, not deleted.
// Ghosting it would tear the live node out of the list it just joined.
async function checkReparent() {
  log("\n— a row re-parented into another list —");
  build();
  const other = document.createElement("ol");
  other.className = "mt-list";
  list.after(other);
  const moving = list.querySelector('[data-key="k4"]');
  await flip(list, () => { other.append(moving); shuffleDom(11); });
  ok(other.contains(moving), "the moved row is still in its new list, alive");
  ok(!list.querySelector('[style*="fixed"]'), "no ghost was made of it");
  other.remove();
}

// ── 3. reduced motion ────────────────────────────────────────────────────────────────────
// Native focus and media-query state cannot be driven in this pane, so force the query the
// way the v3 integrator did: override the prototype getter, then put it back.
async function checkReduced() {
  log("\n— prefers-reduced-motion: reduce —");
  const d = Object.getOwnPropertyDescriptor(MediaQueryList.prototype, "matches");
  Object.defineProperty(MediaQueryList.prototype, "matches", { configurable: true, get: () => true });
  try {
    ok(reducedMotion() === true, "motion.js sees the query");
    build();
    const first = [...list.children].map((n) => n.dataset.key).join();
    await flip(list, () => shuffleDom(3));
    const after = [...list.children].map((n) => n.dataset.key).join();
    ok(players().length === 0, "flip() starts zero players");
    ok(after !== first, "…but the mutation still happened — the list is reordered, instantly");
    settle(list.firstElementChild);
    breathe(list.lastElementChild);
    await drawCheck(tick);
    ok(document.getAnimations().length === 0, "settle(), breathe() and drawCheck() are all dead too");
    ok(tick.style.strokeDashoffset === "0", "…and drawCheck still leaves the tick fully drawn");
  } finally {
    Object.defineProperty(MediaQueryList.prototype, "matches", d);
  }
}

// ── 4. the other three primitives ────────────────────────────────────────────────────────
async function checkPrimitives() {
  log("\n— drawCheck / settle / breathe —");
  const p = drawCheck(tick, 160);
  const draw = document.getAnimations().find((a) => a.effect && a.effect.target === tick);
  ok(!!draw, "drawCheck starts a player");
  if (draw) {
    draw.pause();
    const len = Math.round(tick.getTotalLength());
    ok([...props(draw)].join() === "strokeDashoffset",
       `it animates stroke-dashoffset only, over the ${len}px path`);
    draw.currentTime = 0;
    const a0 = getComputedStyle(tick).strokeDashoffset;
    draw.currentTime = 160;
    const a1 = getComputedStyle(tick).strokeDashoffset;
    ok(Math.round(parseFloat(a0)) === len && Math.round(parseFloat(a1)) === 0,
       `offset ${Math.round(parseFloat(a0))} -> ${Math.round(parseFloat(a1))}`);
    draw.cancel();
  }
  await p;

  build();
  const note = list.firstElementChild;
  settle(note);
  const st = document.getAnimations().find((a) => a.effect && a.effect.target === note);
  ok(!!st && [...props(st)].sort().join() === "opacity,transform", "settle animates transform + opacity");
  // The browser normalises "cubic-bezier(.34, 1.3, .64, 1)" to "cubic-bezier(0.34, 1.3, 0.64, 1)",
  // so compare the four control points, not the two strings.
  const curve = (s) => (String(s).match(/-?[\d.]+/g) || []).map(Number).join();
  const spring = getComputedStyle(document.documentElement).getPropertyValue("--ease-spring").trim();
  ok(!!st && curve(st.effect.getTiming().easing) === curve(spring),
     `settle uses --ease-spring (${spring} -> ${st ? st.effect.getTiming().easing : "-"})`);
  const kf = st ? st.effect.getKeyframes()[0].transform : "";
  ok(/scale\(0?\.92\)/.test(kf) && /rotate\(1\.5deg\)/.test(kf), `peel-in starts at "${kf}"`);
  st && st.cancel();

  const mark = list.lastElementChild;
  const b1 = breathe(note);
  const p1 = document.getAnimations().find((a) => a.effect && a.effect.target === note);
  ok(!!p1 && p1.effect.getTiming().iterations === Infinity && p1.effect.getTiming().duration === 2000,
     "breathe loops opacity forever on a 2s cycle");
  const b2 = breathe(mark);
  ok(!!p1 && p1.playState === "idle", "a second breathe() cancels the first — one ambient loop, app-wide");
  const p2 = document.getAnimations().find((a) => a.effect && a.effect.target === mark);
  const hidden = Object.getOwnPropertyDescriptor(Document.prototype, "hidden");
  Object.defineProperty(document, "hidden", { configurable: true, get: () => true });
  document.dispatchEvent(new Event("visibilitychange"));
  ok(!!p2 && p2.playState === "paused", "it pauses when the app goes to the background");
  Object.defineProperty(document, "hidden", { configurable: true, get: () => false });
  document.dispatchEvent(new Event("visibilitychange"));
  ok(!!p2 && p2.playState === "running", "and resumes when it comes back");
  if (hidden) Object.defineProperty(Document.prototype, "hidden", hidden);
  b2.stop();
  ok(!!p2 && p2.playState === "idle", "stop() cancels it");
  b1.stop();
}

async function runAll() {
  pass = fail = 0;
  out.textContent = "";
  log(`motion.js — ${new Date().toISOString()}`);
  try {
    await checkReorder();
    await checkChurn();
    await checkReparent();
    await checkReduced();
    await checkPrimitives();
  } catch (e) {
    fail++;
    log("THREW  " + (e && e.stack || e));
  }
  build();
  log(`\n${fail === 0 ? "ALL PASS" : "FAILURES"} — ${pass} passed, ${fail} failed`);
}

document.getElementById("mt-shuffle").onclick = () => flip(list, () => shuffleDom(Date.now() & 0xffff));
document.getElementById("mt-churn").onclick = () => flip(list, () => {
  const kids = [...list.children];
  for (const el of kids.slice(0, 3)) el.remove();
  for (let i = 0; i < 3; i++) list.append(rowEl("k" + nextKey++));
  shuffleDom(Date.now() & 0xffff);
});
document.getElementById("mt-settle").onclick = () => { for (const el of list.children) settle(el); };
document.getElementById("mt-draw").onclick = () => drawCheck(tick, 160);
document.getElementById("mt-run").onclick = runAll;

build();
runAll();
</script>
